<div class="p-d-flex p-jc-between p-ai-center">
  <h2>Usuarios</h2>
  <button pButton label="Agregar Usuario" icon="pi pi-plus" (click)="addUser()"></button>
</div>

<p-table [value]="users" [loading]="loading" [responsive]="true">
  <ng-template pTemplate="header">
    <tr>
      <th>Usuario</th>
      <th>Email</th>
      <th>Admin</th>
      <th>Enterprise</th>
      <th>Roles</th>
      <th>Activo</th>
      <th>Acciones</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-user>
    <tr>
      <td>{{ user.username }}</td>
      <td>{{ user.email }}</td>
      <td>
        <span [class]="user.admin ? 'status-active' : 'status-inactive'">
          {{ user.admin ? 'Sí' : 'No' }}
        </span>
      </td>
      <td>
        <span *ngIf="user.enterprise">
          {{ getEnterpriseName(user.enterprise) }}
        </span>
        <span *ngIf="!user.enterprise" class="no-enterprise">-</span>
      </td>
      <td>
        <span *ngFor="let role of user.roles" class="role-badge">{{ role }}</span>
        <span *ngIf="!user.roles || user.roles.length === 0" class="no-roles">Sin roles</span>
      </td>
      <td>
        <span [class]="user.active ? 'status-active' : 'status-inactive'">
          {{ user.active ? 'Activo' : 'Inactivo' }}
        </span>
      </td>
      <td>
        <button 
          pButton 
          icon="pi pi-pencil" 
          (click)="editUser(user._id)" 
          label="Editar"
          class="p-button-sm p-button-text p-mr-2"
        ></button>
        <button 
          pButton 
          icon="pi pi-trash" 
          (click)="deleteUser(user._id)" 
          label="Eliminar"
          severity="danger"
          class="p-button-sm p-button-text"
        ></button>
      </td>
    </tr>
  </ng-template>
</p-table>
