<div class="list-container">
  <div class="list-header">
    <div class="list-title-section">
      <h1 class="list-title">Lista de Usuarios</h1>
      <p class="list-subtitle">Gestiona los usuarios del sistema</p>
    </div>
    <button *ngIf="canCreate" pButton label="Crear Usuario" icon="pi pi-plus" (click)="addUser()"
      class="create-button"></button>
  </div>

  <div class="list-content">
    <ag-grid-angular style="width: 100%; height: 500px;" [class]="myTheme" [rowData]="users" [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef" [pagination]="true" [paginationPageSize]="10"
      [paginationPageSizeSelector]="[10, 25, 50]">
    </ag-grid-angular>
  </div>
</div>
