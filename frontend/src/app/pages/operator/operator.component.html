<div class="operator-dashboard">
  <p-dropdown
    [options]="operators"
    optionLabel="positionName"
    placeholder="Select Operator"
    [(ngModel)]="selectedOperator"
    (onChange)="onOperatorChange($event.value)"
  ></p-dropdown>

  <p-button
    label="Next Customer"
    (onClick)="nextCustomer()"
    *ngIf="selectedCustomer?.status !== 'IN_SERVICE'"
  ></p-button>

  <div>
    <h2>Waiting Room</h2>
    <ul>
      <li *ngFor="let service of waitingServices">
        {{ service.label }} - {{ service.count || 0 }} customers waiting
      </li>
    </ul>
  </div>

  <div *ngIf="selectedCustomer" class="customer-info">
    <h2>Current Customer</h2>
    <p><strong>Ticket Number:</strong> {{ selectedCustomer.ticketNumber }}</p>
    <p>
      <strong>Position:</strong> {{ selectedCustomer.operator?.positionName }}
    </p>
    <p><strong>Status:</strong> {{ selectedCustomer.status }}</p>

    <div class="'buttons">
      <p-button
        *ngIf="selectedCustomer.status === 'CALLING'"
        label="Attend Customer"
        (onClick)="attendCustomer()"
      ></p-button>
      <p-button
        *ngIf="selectedCustomer.status === 'IN_SERVICE'"
        label="Complete Service"
        (onClick)="completeService()"
      ></p-button>
    </div>
  </div>
</div>
