<div class="app-form-layout">
  <div class="app-form-card">
    <h2 class="form-title">Crear Servicio</h2>
    <form [formGroup]="serviceForm" (ngSubmit)="onSubmit()">
      <div class="p-field">
        <label for="name">Nombre *</label>
        <input
          id="name"
          pInputText
          formControlName="name"
          class="p-inputtext"
        />
        <small
          class="p-error"
          *ngIf="
            serviceForm.get('name')?.invalid && serviceForm.get('name')?.touched
          "
        >
          Name is required
        </small>
      </div>

      <div class="p-field">
        <label for="description">description</label>
        <input
          id="description"
          type="description"
          pInputText
          formControlName="description"
          class="p-inputtext"
        />
      </div>

      <div class="p-field">
        <label for="prefix">Prefijo *</label>
        <input
          id="prefix"
          type="prefix"
          pInputText
          formControlName="prefix"
          class="p-inputtext"
        />
        <small
          class="p-error"
          *ngIf="
            serviceForm.get('prefix')?.invalid && serviceForm.get('prefix')?.touched
          "
        >
          El prefijo es requerido
        </small>
      </div>

      <div class="p-field">
        <label for="enterprise">Empresa *</label>
        <p-select
          id="enterprise"
          formControlName="enterprise"
          [options]="enterprises"
          optionLabel="name"
          optionValue="_id"
          placeholder="Selecciona una empresa"
          [disabled]="isEnterpriseAdmin"
        ></p-select>
        <small
          class="p-error"
          *ngIf="
            serviceForm.get('enterprise')?.invalid && serviceForm.get('enterprise')?.touched
          "
        >
          La empresa es requerida
        </small>
        <small *ngIf="isEnterpriseAdmin" class="p-text-secondary">
          Su empresa ha sido asignada automáticamente
        </small>
      </div>
      <div class="form-actions">
        <button pButton type="button" label="Cancelar" icon="pi pi-times" class="p-button-secondary" (click)="onCancel()"></button>
        <button pButton type="submit" label="Crear Servicio" icon="pi pi-check" class="p-button-success" [disabled]="serviceForm.invalid"></button>
      </div>
    </form>
  </div>
</div>
