<div class="p-d-flex p-jc-between p-ai-center">
  <h2>Services</h2>
  <button
    pButton
    label="Add New Service"
    icon="pi pi-plus"
    (click)="addService()"
  ></button>
</div>

<p-table [value]="services" [loading]="loading" [responsive]="true">
  <ng-template pTemplate="header">
    <tr>
      <th>Name</th>
      <th>Description</th>
      <th>Prefix</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-customer>
    <tr>
      <td>{{ customer.name }}</td>
      <td>{{ customer.description }}</td>
      <td>{{ customer.prefix }}</td>
      <td>
        <button
          pButton
          icon="pi pi-pencil"
          (click)="editService(customer._id)"
          label="Edit"
        ></button>
      </td>
    </tr>
  </ng-template>
</p-table>
