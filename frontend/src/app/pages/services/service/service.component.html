<div class="list-container">
  <div class="list-header">
    <div class="list-title-section">
      <h1 class="list-title">Lista de Servicios</h1>
      <p class="list-subtitle">Gestiona los servicios del sistema</p>
    </div>
    <button 
      pButton 
      label="Crear Servicio" 
      icon="pi pi-plus" 
      (click)="addService()"
      class="create-button"
    ></button>
  </div>

  <div class="list-content">
    <p-table 
      [value]="services" 
      [loading]="loading" 
      styleClass="p-datatable-striped p-datatable-sm modern-table"
      [paginator]="true"
      [rows]="10"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} servicios"
      [rowsPerPageOptions]="[10, 25, 50]"
    >
      <ng-template pTemplate="header">
        <tr>
          <th>Nombre</th>
          <th>Descripción</th>
          <th>Prefijo</th>
          <th>Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-service>
        <tr>
          <td class="service-name">{{ service.name }}</td>
          <td>{{ service.description || '-' }}</td>
          <td>
            <span class="prefix-badge">{{ service.prefix }}</span>
          </td>
          <td>
            <div class="action-buttons">
              <button
                pButton
                icon="pi pi-pencil"
                (click)="editService(service._id)"
                pTooltip="Editar"
                tooltipPosition="top"
                class="p-button-sm p-button-text action-button"
              ></button>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
