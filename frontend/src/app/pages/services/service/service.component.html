<div class="list-container">
  <div class="list-header">
    <div class="list-title-section">
      <h1 class="list-title">Lista de Servicios</h1>
      <p class="list-subtitle">Gestiona los servicios del sistema</p>
    </div>
    <button pButton label="Crear Servicio" icon="pi pi-plus" (click)="addService()" class="create-button"></button>
  </div>

  <div class="list-content">
    <p-table [value]="services" [loading]="loading" [paginator]="true" [rows]="10"
      [rowsPerPageOptions]="[10, 25, 50]" [showCurrentPageReport]="true" currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords}"
      styleClass="p-datatable-sm p-datatable-striped" [tableStyle]="{ 'min-width': '50rem' }">
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="name">Nombre <p-sortIcon field="name"></p-sortIcon></th>
          <th>Descripción</th>
          <th>Prefijo</th>
          <th>Empresa</th>
          <th style="width: 100px;">Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-row>
        <tr>
          <td>{{ row.name }}</td>
          <td>{{ row.description || '-' }}</td>
          <td><span class="prefix-badge">{{ row.prefix }}</span></td>
          <td>{{ getEnterpriseName(row.enterprise) }}</td>
          <td>
            <button pButton icon="pi pi-pencil" class="p-button-text p-button-sm" pTooltip="Editar" (click)="editService(row._id)"></button>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr><td [attr.colspan]="5">Sin datos</td></tr>
      </ng-template>
      <ng-template pTemplate="loadingbody">
        <tr><td [attr.colspan]="5">Cargando...</td></tr>
      </ng-template>
    </p-table>
  </div>
</div>
