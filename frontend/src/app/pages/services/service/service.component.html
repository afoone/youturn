<div class="page-container">
  <div class="page-header">
    <div class="page-header-info">
      <h1 class="page-title">Servicios</h1>
      <p class="page-subtitle">Gestiona los servicios del sistema</p>
    </div>
    <button pButton label="Crear Servicio" icon="pi pi-plus"
      (click)="addService()" class="btn-primary"></button>
  </div>

  <div class="content-card">
    <p-table [value]="services" [loading]="loading" styleClass="p-datatable-sm app-table"
      [paginator]="true" [rows]="10" [showCurrentPageReport]="true"
      currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} servicios"
      [rowsPerPageOptions]="[10, 25, 50]">
      <ng-template pTemplate="header">
        <tr>
          <th>Nombre</th>
          <th>Descripción</th>
          <th>Prefijo</th>
          <th>Empresa</th>
          <th>Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-service>
        <tr>
          <td class="cell-primary">{{ service.name }}</td>
          <td class="cell-secondary">{{ service.description || '-' }}</td>
          <td><span class="cell-code">{{ service.prefix }}</span></td>
          <td class="cell-secondary">
            {{ service.enterprise ? getEnterpriseName(service.enterprise) : '-' }}
          </td>
          <td>
            <div class="action-buttons">
              <button pButton icon="pi pi-pencil" (click)="editService(service._id)"
                pTooltip="Editar" tooltipPosition="top" class="btn-icon"></button>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
