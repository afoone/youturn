<div class="list-container">
  <div class="list-header">
    <div class="list-title-section">
      <h1 class="list-title">Lista de Puntos de Ticket</h1>
      <p class="list-subtitle">Gestiona los puntos de ticket del sistema</p>
    </div>
    <button *ngIf="canCreate" pButton label="Crear Punto de Ticket" icon="pi pi-plus" (click)="addTicketPoint()"
      class="create-button"></button>
  </div>

  <div class="list-content">
    <ag-grid-angular style="width: 100%; height: 500px;" [class]="myTheme" [rowData]="ticketPoints"
      [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [pagination]="true" [paginationPageSize]="10"
      [paginationPageSizeSelector]="[10, 25, 50]">
    </ag-grid-angular>
  </div>
</div>

<!-- Dialog para mostrar el QR -->
<p-dialog [(visible)]="showQrDialog" [modal]="true" [style]="{width: '400px'}" header="Código QR del Punto de Ticket"
  [closable]="true" (onHide)="closeQrDialog()">
  <div class="qr-dialog-content" *ngIf="selectedTicketPoint">
    <p class="qr-ticket-point-name"><strong>{{ selectedTicketPoint.name }}</strong></p>
    <div class="qr-code-container">
      <img [src]="qrCodeUrl" alt="QR Code" class="qr-code-image" />
    </div>
    <p class="qr-link-text">Escanea el código QR para acceder al punto de ticket</p>
    <div class="qr-actions">
      <button pButton label="Copiar Enlace" icon="pi pi-copy" (click)="copyQrLink()" class="p-button-sm"></button>
    </div>
  </div>
</p-dialog>
