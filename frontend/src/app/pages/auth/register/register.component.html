<div class="auth-layout">
  <!-- Brand Panel -->
  <div class="auth-brand">
    <div class="brand-content">
      <img src="/assets/img/logo.png" alt="YourTurn" class="brand-logo" />
      <h1 class="brand-headline">Únete a<br>YourTurn Manager</h1>
      <p class="brand-subline">Crea tu cuenta y empieza a gestionar tus colas de forma digital, eficiente y sin papel.</p>
    </div>
  </div>

  <!-- Form Panel -->
  <div class="auth-form-panel">
    <div class="auth-form-box">
      <div class="auth-form-header">
        <h2 class="auth-form-title">Crear cuenta</h2>
        <p class="auth-form-subtitle">Rellena los datos para registrarte</p>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="auth-field">
          <label for="email">Email <span style="color:var(--color-danger)">*</span></label>
          <input
            id="email"
            type="email"
            pInputText
            formControlName="email"
            placeholder="tu@empresa.com"
            [class.ng-invalid]="registerForm.get('email')?.invalid && registerForm.get('email')?.touched"
          />
          <small class="p-error" *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
            Email válido requerido
          </small>
        </div>

        <div class="auth-field">
          <label for="nombre">Nombre</label>
          <input id="nombre" type="text" pInputText formControlName="nombre" placeholder="Tu nombre" />
        </div>

        <div class="auth-field">
          <label for="apellidos">Apellidos</label>
          <input id="apellidos" type="text" pInputText formControlName="apellidos" placeholder="Tus apellidos" />
        </div>

        <div class="auth-field">
          <label for="password">Contraseña</label>
          <input
            id="password"
            type="password"
            pInputText
            formControlName="password"
            placeholder="Mínimo 6 caracteres"
            [class.ng-invalid]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched"
          />
          <small class="p-error" *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
            Contraseña requerida (mínimo 6 caracteres)
          </small>
        </div>

        <div class="auth-field">
          <label for="enterpriseId">Enterprise <span style="color:var(--color-danger)">*</span></label>
          <p-select
            id="enterpriseId"
            formControlName="enterpriseId"
            [options]="enterprises"
            optionLabel="name"
            optionValue="_id"
            placeholder="Selecciona una enterprise"
            [class.ng-invalid]="registerForm.get('enterpriseId')?.invalid && registerForm.get('enterpriseId')?.touched"
          ></p-select>
          <small class="p-error" *ngIf="registerForm.get('enterpriseId')?.invalid && registerForm.get('enterpriseId')?.touched">
            Enterprise es requerida
          </small>
        </div>

        <div class="auth-field">
          <label for="comentario">Comentario</label>
          <textarea
            id="comentario"
            pInputTextarea
            formControlName="comentario"
            rows="2"
            placeholder="Información adicional (opcional)"
          ></textarea>
        </div>

        <p-message
          *ngIf="errorMessage"
          severity="error"
          [text]="errorMessage"
          [closable]="true"
        ></p-message>

        <p-button
          type="submit"
          label="Crear cuenta"
          icon="pi pi-user-plus"
          [loading]="loading"
          [disabled]="registerForm.invalid"
          styleClass="auth-submit"
        ></p-button>
      </form>

      <div class="auth-footer">
        ¿Ya tienes cuenta? <a routerLink="/login">Iniciar sesión</a>
      </div>
    </div>
  </div>
</div>
