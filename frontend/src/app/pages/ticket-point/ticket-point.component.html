<div class="ticket-point-container">
  <div class="header-section" *ngIf="!createdCustomer">
    <div class="logo-container">
      <img src="/assets/img/logo.png" alt="Logo" class="header-logo" />
    </div>
    <h1 class="main-title">Selecciona un Servicio</h1>
    <p class="subtitle">Toca el servicio para obtener tu número de ticket</p>
  </div>

  <div class="services-grid" *ngIf="!createdCustomer">
    <afoone-service-card
      *ngFor="let service of services"
      [service]="service"
      (selectService)="addToQueue($event)"
    ></afoone-service-card>
  </div>

  <div class="ticket-result" *ngIf="createdCustomer">
    <div class="ticket-card">
      <div class="ticket-logo-container">
        <img src="/assets/img/logo.png" alt="Logo" class="ticket-logo" />
      </div>
      <h2 class="ticket-title">¡Ticket Generado!</h2>
      <div class="service-name" *ngIf="selectedServiceData">
        <p class="service-label">Servicio:</p>
        <p class="service-value">{{ selectedServiceData.name }}</p>
      </div>
      <p class="ticket-label">Tu número de ticket es:</p>
      <p class="ticket-number">{{ createdCustomer?.ticketNumber }}</p>
      <div class="action-buttons">
        <button class="action-button pdf-button" (click)="generatePDF()">
          <span class="button-icon">📄</span>
          Generar PDF
        </button>
        <button class="action-button pkpass-button" (click)="generatePKPass()">
          <span class="button-icon">📱</span>
          Generar PKPass
        </button>
      </div>
      <button class="back-button" (click)="goBack()">
        <span class="back-icon">←</span>
        Volver a Servicios
      </button>
    </div>
  </div>
</div>
