<div class="list-container">
  <div class="list-header">
    <div class="list-title-section">
      <h1 class="list-title">Lista de Planes</h1>
      <p class="list-subtitle">Gestiona los planes del sistema</p>
    </div>
    <button *ngIf="isAdmin" pButton label="Crear Plan" icon="pi pi-plus" (click)="addPlan()"
      class="create-button"></button>
  </div>

  <div class="list-content">
    <p-table [value]="plans" [loading]="loading" [paginator]="true" [rows]="10"
      [rowsPerPageOptions]="[10, 25, 50]" [showCurrentPageReport]="true" currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords}"
      styleClass="p-datatable-sm p-datatable-striped" [tableStyle]="{ 'min-width': '50rem' }">
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="codigo">Código <p-sortIcon field="codigo"></p-sortIcon></th>
          <th pSortableColumn="descripcion">Descripción <p-sortIcon field="descripcion"></p-sortIcon></th>
          <th pSortableColumn="precio">Precio <p-sortIcon field="precio"></p-sortIcon></th>
          <th>Max Kioscos</th>
          <th>Max Usuarios</th>
          <th>Max Servicios</th>
          <th style="width: 120px;">Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-row>
        <tr>
          <td>{{ row.codigo }}</td>
          <td>{{ row.descripcion }}</td>
          <td>{{ formatPrice(row.precio) }}</td>
          <td>{{ row.maxTicketPoints }}</td>
          <td>{{ row.maxUsuarios }}</td>
          <td>{{ row.maxServicios }}</td>
          <td>
            <span *ngIf="!isAdmin">-</span>
            <span *ngIf="isAdmin" class="action-buttons">
              <button pButton icon="pi pi-pencil" class="p-button-text p-button-sm" pTooltip="Editar" (click)="editPlan(row._id)"></button>
              <button pButton icon="pi pi-trash" class="p-button-text p-button-sm p-button-danger" pTooltip="Eliminar" (click)="deletePlan(row._id)"></button>
            </span>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr><td [attr.colspan]="7">Sin datos</td></tr>
      </ng-template>
      <ng-template pTemplate="loadingbody">
        <tr><td [attr.colspan]="7">Cargando...</td></tr>
      </ng-template>
    </p-table>
  </div>
</div>
