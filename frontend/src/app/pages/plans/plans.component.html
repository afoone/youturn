<div class="page-container">
  <div class="page-header">
    <div class="page-header-info">
      <h1 class="page-title">Planes</h1>
      <p class="page-subtitle">Gestiona los planes del sistema</p>
    </div>
    <button *ngIf="isAdmin" pButton label="Crear Plan" icon="pi pi-plus"
      (click)="addPlan()" class="btn-primary"></button>
  </div>

  <div class="content-card">
    <p-table [value]="plans" [loading]="loading" styleClass="p-datatable-sm app-table"
      [paginator]="true" [rows]="10" [showCurrentPageReport]="true"
      currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} planes"
      [rowsPerPageOptions]="[10, 25, 50]">
      <ng-template pTemplate="header">
        <tr>
          <th>Código</th>
          <th>Descripción</th>
          <th>Precio</th>
          <th>Kioscos</th>
          <th>Usuarios</th>
          <th>Servicios</th>
          <th>Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-plan>
        <tr>
          <td><span class="cell-code">{{ plan.codigo }}</span></td>
          <td class="cell-secondary">{{ plan.descripcion }}</td>
          <td class="cell-secondary">{{ formatPrice(plan.precio) }}</td>
          <td class="cell-secondary">{{ plan.maxTicketPoints }}</td>
          <td class="cell-secondary">{{ plan.maxUsuarios }}</td>
          <td class="cell-secondary">{{ plan.maxServicios }}</td>
          <td>
            <div class="action-buttons" *ngIf="isAdmin">
              <button pButton icon="pi pi-pencil" (click)="editPlan(plan._id!)"
                pTooltip="Editar" tooltipPosition="top" class="btn-icon"></button>
              <button pButton icon="pi pi-trash" (click)="deletePlan(plan._id!)"
                pTooltip="Eliminar" tooltipPosition="top" class="btn-icon danger"></button>
            </div>
            <span *ngIf="!isAdmin" class="cell-muted">-</span>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
