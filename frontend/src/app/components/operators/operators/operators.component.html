<div class="list-container">
  <div class="list-header">
    <div class="list-title-section">
      <h1 class="list-title">Lista de Operadores</h1>
      <p class="list-subtitle">Gestiona los operadores del sistema</p>
    </div>
    <button pButton label="Crear Operador" icon="pi pi-plus" (click)="addOperator()" class="create-button"></button>
  </div>

  <div class="list-content">
    <p-table [value]="operators" [loading]="loading" [paginator]="true" [rows]="10"
      [rowsPerPageOptions]="[10, 25, 50]" [showCurrentPageReport]="true" currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords}"
      styleClass="p-datatable-sm p-datatable-striped" [tableStyle]="{ 'min-width': '50rem' }">
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="positionName">Nombre del Puesto <p-sortIcon field="positionName"></p-sortIcon></th>
          <th>Descripción</th>
          <th>Servicios</th>
          <th>Desc. Ruta</th>
          <th>Cliente</th>
          <th style="width: 120px;">Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-row>
        <tr>
          <td>{{ row.positionName }}</td>
          <td>{{ row.description || '-' }}</td>
          <td>
            <span *ngIf="!row.services?.length">-</span>
            <span *ngIf="row.services?.length" class="services-list">
              <span *ngFor="let s of row.services" class="service-tag">{{ s }}</span>
            </span>
          </td>
          <td>{{ row.pathDescription || '-' }}</td>
          <td>{{ row.customer?.name || '-' }}</td>
          <td class="action-buttons">
            <button pButton icon="pi pi-desktop" class="p-button-text p-button-sm" pTooltip="Dashboard" (click)="viewOperatorBoard(row._id)"></button>
            <button pButton icon="pi pi-pencil" class="p-button-text p-button-sm" pTooltip="Editar" (click)="editOperator(row._id)"></button>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr><td [attr.colspan]="6">Sin datos</td></tr>
      </ng-template>
      <ng-template pTemplate="loadingbody">
        <tr><td [attr.colspan]="6">Cargando...</td></tr>
      </ng-template>
    </p-table>
  </div>
</div>
