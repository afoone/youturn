<div class="page-container">
  <div class="page-header">
    <div class="page-header-info">
      <h1 class="page-title">Operadores</h1>
      <p class="page-subtitle">Gestiona los operadores del sistema</p>
    </div>
    <button pButton label="Crear Operador" icon="pi pi-plus"
      (click)="addOperator()" class="btn-primary"></button>
  </div>

  <div class="content-card">
    <p-table [value]="operators" [loading]="loading" styleClass="p-datatable-sm app-table"
      [paginator]="true" [rows]="10" [showCurrentPageReport]="true"
      currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} operadores"
      [rowsPerPageOptions]="[10, 25, 50]">
      <ng-template pTemplate="header">
        <tr>
          <th>Puesto</th>
          <th>Descripción</th>
          <th>Servicios</th>
          <th>Ruta</th>
          <th>Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-operator>
        <tr>
          <td class="cell-primary">{{ operator.positionName }}</td>
          <td class="cell-secondary">{{ operator.description || '-' }}</td>
          <td>
            <div class="tags-row" *ngIf="operator.services?.length">
              <span *ngFor="let service of operator.services" class="badge badge-neutral">{{ service }}</span>
            </div>
            <span *ngIf="!operator.services?.length" class="cell-muted">-</span>
          </td>
          <td class="cell-secondary">{{ operator.pathDescription || '-' }}</td>
          <td>
            <div class="action-buttons">
              <button pButton icon="pi pi-desktop" (click)="viewOperatorBoard(operator._id)"
                pTooltip="Dashboard" tooltipPosition="top" class="btn-icon"></button>
              <button pButton icon="pi pi-pencil" (click)="editOperator(operator._id)"
                pTooltip="Editar" tooltipPosition="top" class="btn-icon"></button>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
