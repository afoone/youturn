<div class="p-d-flex p-jc-between p-ai-center">
  <h2>Operators</h2>
  <button
    pButton
    label="Add New Operator"
    icon="pi pi-plus"
    (click)="addOperator()"
  ></button>
</div>

<p-table [value]="operators" [loading]="loading" [responsive]="true">
  <ng-template pTemplate="header">
    <tr>
      <th id="positionName">Position Name</th>
      <th id="description">Description</th>
      <th id="services">Services</th>
      <th id="pathDescription">Path Description</th>
      <th id="customer">Customer</th>
      <th id="actions">Actions</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-operator>
    <tr>
      <td>{{ operator.positionName }}</td>
      <td>{{ operator.description }}</td>
      <td>{{ operator.services.join(", ") }}</td>
      <td>{{ operator.pathDescription }}</td>
      <td>{{ operator.customer?.name }}</td>
      <td>
        <button
          pButton
          icon="pi pi-pencil"
          (click)="editOperator(operator._id)"
          label="Edit"
        ></button>
      </td>
    </tr>
  </ng-template>
</p-table>
