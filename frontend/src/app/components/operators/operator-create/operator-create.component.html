<div class="app-form-layout">
  <div class="app-form-card">
    <h2 class="form-title">Crear Operador</h2>
    <form [formGroup]="operatorForm" (ngSubmit)="onSubmit()">
      <div class="p-field">
        <label for="positionName">Position Name</label>
        <input
          id="positionName"
          pInputText
          formControlName="positionName"
          class="p-inputtext"
        />
        <small
          class="p-error"
          *ngIf="
            operatorForm.get('positionName')?.invalid &&
            operatorForm.get('positionName')?.touched
          "
        >
          Position Name is required
        </small>
      </div>

      <div class="p-field">
        <label for="description">Description</label>
        <input
          id="description"
          pInputText
          formControlName="description"
          class="p-inputtext"
        />
        <small
          class="p-error"
          *ngIf="
            operatorForm.get('description')?.invalid &&
            operatorForm.get('description')?.touched
          "
        >
          Description is required
        </small>
      </div>

      <div class="p-field">
        <label for="services">Services</label>
        <p-multiSelect
          id="services"
          formControlName="services"
          [options]="availableServices"
          optionLabel="name"
          optionValue="_id"
          placeholder="Select Services"
          [filter]="true"
          [showClear]="true"
        ></p-multiSelect>

        <small
          class="p-error"
          *ngIf="
            operatorForm.get('services')?.invalid &&
            operatorForm.get('services')?.touched
          "
        >
          At least one service must be selected
        </small>
      </div>

      <div class="p-field">
        <label for="pathDescription">Path Description</label>
        <input
          id="pathDescription"
          pInputText
          formControlName="pathDescription"
          class="p-inputtext"
        />
        <small
          class="p-error"
          *ngIf="
            operatorForm.get('pathDescription')?.invalid &&
            operatorForm.get('pathDescription')?.touched
          "
        >
          Path Description is required
        </small>
      </div>

      <div class="form-actions">
        <button pButton type="button" label="Cancelar" icon="pi pi-times" class="p-button-secondary" (click)="onCancel()"></button>
        <button pButton type="submit" label="Crear Operador" icon="pi pi-check" class="p-button-success" [disabled]="operatorForm.invalid"></button>
      </div>
    </form>
  </div>
</div>
