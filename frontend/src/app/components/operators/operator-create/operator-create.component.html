<div class="form-page">
  <div class="form-card">
    <div class="form-card-header">
      <h2 class="form-card-title">Crear Operador</h2>
      <p class="form-card-subtitle">Configura un nuevo puesto de operador</p>
    </div>
    <form [formGroup]="operatorForm" (ngSubmit)="onSubmit()">
      <div class="field">
        <label class="field-label" for="positionName">Nombre del puesto <span class="required">*</span></label>
        <input id="positionName" pInputText formControlName="positionName" placeholder="Ej: Caja 1, Ventanilla A"
          [class.ng-invalid]="operatorForm.get('positionName')?.invalid && operatorForm.get('positionName')?.touched" />
        <small class="field-error" *ngIf="operatorForm.get('positionName')?.invalid && operatorForm.get('positionName')?.touched">El nombre del puesto es requerido</small>
      </div>
      <div class="field">
        <label class="field-label" for="description">Descripción</label>
        <input id="description" pInputText formControlName="description" placeholder="Descripción del puesto (opcional)" />
      </div>
      <div class="field">
        <label class="field-label" for="services">Servicios</label>
        <p-multiSelect id="services" formControlName="services" [options]="availableServices"
          optionLabel="name" optionValue="_id" placeholder="Selecciona los servicios"
          [filter]="true" [showClear]="true"></p-multiSelect>
      </div>
      <div class="field">
        <label class="field-label" for="pathDescription">Descripción de ruta</label>
        <input id="pathDescription" pInputText formControlName="pathDescription" placeholder="Instrucciones para llegar al puesto" />
      </div>
      <div class="form-actions">
        <button pButton type="button" label="Cancelar" icon="pi pi-times" severity="secondary" (click)="onCancel()"></button>
        <button pButton type="submit" label="Crear Operador" icon="pi pi-check" [disabled]="operatorForm.invalid"></button>
      </div>
    </form>
  </div>
</div>
