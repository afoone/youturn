<div class="list-container">
  <div class="list-header">
    <div class="list-title-section">
      <h1 class="list-title">Lista de Pantallas</h1>
      <p class="list-subtitle">Gestiona las pantallas del sistema</p>
    </div>
    <button pButton label="Crear Pantalla" icon="pi pi-plus" (click)="addScreen()" class="create-button"></button>
  </div>

  <div class="list-content">
    <ag-grid-angular style="width: 100%; height: 500px;" [class]="myTheme" [rowData]="screens" [columnDefs]="columnDefs"
      [defaultColDef]="defaultColDef" [pagination]="true" [paginationPageSize]="10"
      [paginationPageSizeSelector]="[10, 25, 50]">
    </ag-grid-angular>
  </div>
</div>
