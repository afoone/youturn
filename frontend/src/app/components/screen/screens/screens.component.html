<div class="list-container">
  <div class="list-header">
    <div class="list-title-section">
      <h1 class="list-title">Lista de Pantallas</h1>
      <p class="list-subtitle">Gestiona las pantallas del sistema</p>
    </div>
    <button pButton label="Crear Pantalla" icon="pi pi-plus" (click)="addScreen()" class="create-button"></button>
  </div>

  <div class="list-content">
    <p-table [value]="screens" [loading]="loading" [paginator]="true" [rows]="10"
      [rowsPerPageOptions]="[10, 25, 50]" [showCurrentPageReport]="true" currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords}"
      styleClass="p-datatable-sm p-datatable-striped" [tableStyle]="{ 'min-width': '50rem' }">
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="name">Nombre <p-sortIcon field="name"></p-sortIcon></th>
          <th>Descripción</th>
          <th>Servicios</th>
          <th style="width: 120px;">Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-row>
        <tr>
          <td>{{ row.name }}</td>
          <td>{{ row.description || '-' }}</td>
          <td>
            <span *ngIf="!row.services?.length">-</span>
            <span *ngIf="row.services?.length" class="services-list">
              <span *ngFor="let s of row.services" class="service-tag">{{ s }}</span>
            </span>
          </td>
          <td class="action-buttons">
            <button pButton icon="pi pi-eye" class="p-button-text p-button-sm" pTooltip="Ver" (click)="viewScreen(row._id)"></button>
            <button pButton icon="pi pi-pencil" class="p-button-text p-button-sm" pTooltip="Editar" (click)="editScreen(row._id)"></button>
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage">
        <tr><td [attr.colspan]="4">Sin datos</td></tr>
      </ng-template>
      <ng-template pTemplate="loadingbody">
        <tr><td [attr.colspan]="4">Cargando...</td></tr>
      </ng-template>
    </p-table>
  </div>
</div>
