<div class="page-container">
  <div class="page-header">
    <div class="page-header-info">
      <h1 class="page-title">Pantallas</h1>
      <p class="page-subtitle">Gestiona las pantallas del sistema</p>
    </div>
    <button pButton label="Crear Pantalla" icon="pi pi-plus"
      (click)="addScreen()" class="btn-primary"></button>
  </div>

  <p-sidebar [(visible)]="sidebarVisible" position="right" [style]="{ width: '450px' }"
    [modal]="true" [dismissible]="false" styleClass="screen-create-sidebar">
    <ng-template pTemplate="header">
      <h2 style="font-size:1.125rem;font-weight:700;margin:0;color:var(--color-gray-900)">Nueva Pantalla</h2>
    </ng-template>

    <form [formGroup]="screenForm" (ngSubmit)="onSubmitScreen($event)" style="padding:1.5rem;display:flex;flex-direction:column;gap:1.25rem;">
      <div class="field">
        <label class="field-label">Nombre <span class="required">*</span></label>
        <input id="name" type="text" pInputText formControlName="name"
          placeholder="Nombre de la pantalla"
          (keydown.enter)="$event.preventDefault()"
          [class.ng-invalid]="screenForm.get('name')?.invalid && screenForm.get('name')?.touched" />
        <small class="field-error" *ngIf="screenForm.get('name')?.invalid && screenForm.get('name')?.touched">
          El nombre es requerido
        </small>
      </div>

      <div class="field">
        <label class="field-label">Descripción</label>
        <input id="description" type="text" pInputText formControlName="description" placeholder="Descripción (opcional)" />
      </div>

      <div class="field">
        <label class="field-label">Servicios <span class="required">*</span></label>
        <p-multiSelect id="services" formControlName="services" [options]="availableServices"
          optionLabel="name" optionValue="_id" placeholder="Selecciona servicios"
          [filter]="true" [showClear]="true"
          [class.ng-invalid]="screenForm.get('services')?.invalid && screenForm.get('services')?.touched">
        </p-multiSelect>
        <small class="field-error" *ngIf="screenForm.get('services')?.invalid && screenForm.get('services')?.touched">
          Al menos un servicio debe ser seleccionado
        </small>
      </div>

      <p-message *ngIf="errorMessage" severity="error" [text]="errorMessage" [closable]="true"></p-message>

      <div style="display:flex;gap:0.75rem;justify-content:flex-end;padding-top:0.5rem;border-top:1px solid var(--surface-border);margin-top:0.5rem;">
        <p-button type="button" label="Cancelar" icon="pi pi-times" (click)="closeSidebar()" severity="secondary"></p-button>
        <p-button type="submit" label="Crear Pantalla" icon="pi pi-check" [disabled]="screenForm.invalid"></p-button>
      </div>
    </form>
  </p-sidebar>

  <div class="content-card">
    <p-table [value]="screens" [loading]="loading" styleClass="p-datatable-sm app-table"
      [paginator]="true" [rows]="10" [showCurrentPageReport]="true"
      currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} pantallas"
      [rowsPerPageOptions]="[10, 25, 50]">
      <ng-template pTemplate="header">
        <tr>
          <th>Nombre</th>
          <th>Descripción</th>
          <th>Servicios</th>
          <th>Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-screen>
        <tr>
          <td class="cell-primary">{{ screen.name }}</td>
          <td class="cell-secondary">{{ screen.description || '-' }}</td>
          <td>
            <div class="tags-row" *ngIf="screen.services?.length">
              <span *ngFor="let service of screen.services" class="badge badge-neutral">{{ service }}</span>
            </div>
            <span *ngIf="!screen.services?.length" class="cell-muted">-</span>
          </td>
          <td>
            <div class="action-buttons">
              <button pButton icon="pi pi-pencil" (click)="editScreen(screen._id)"
                pTooltip="Editar" tooltipPosition="top" class="btn-icon"></button>
              <button pButton icon="pi pi-eye" (click)="viewScreen(screen._id)"
                pTooltip="Ver pantalla" tooltipPosition="top" class="btn-icon"></button>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
