<div class="form-page">
  <div class="form-card">
    <div class="form-card-header">
      <h2 class="form-card-title">Editar Pantalla</h2>
      <p class="form-card-subtitle">Modifica la configuración de la pantalla</p>
    </div>
    <form [formGroup]="operatorForm" (ngSubmit)="onSubmit()">
      <div class="field">
        <label class="field-label" for="positionName">Nombre <span class="required">*</span></label>
        <input id="positionName" pInputText formControlName="positionName" placeholder="Nombre de la pantalla"
          [class.ng-invalid]="operatorForm.get('positionName')?.invalid && operatorForm.get('positionName')?.touched" />
        <small class="field-error" *ngIf="operatorForm.get('positionName')?.invalid && operatorForm.get('positionName')?.touched">
          El nombre es requerido
        </small>
      </div>
      <div class="field">
        <label class="field-label" for="description">Descripción</label>
        <input id="description" pInputText formControlName="description" placeholder="Descripción (opcional)" />
      </div>
      <div class="form-actions">
        <button pButton type="button" label="Cancelar" icon="pi pi-times" severity="secondary" (click)="onCancel()"></button>
        <button pButton type="submit" label="Guardar Cambios" icon="pi pi-check" [disabled]="operatorForm.invalid"></button>
      </div>
    </form>
  </div>
</div>
