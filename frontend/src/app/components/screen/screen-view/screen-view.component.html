<div>
  <h1>{{ screen?.name }}</h1>

  <p-table [value]="customers">
    <ng-template pTemplate="header">
      <tr>
        <th id="customer-ticket">Cliente</th>
        <th id="customer-position">Mesa</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-customer>
      <tr>
        <td>{{ customer.ticketNumber }}</td>
        <td>{{ customer?.operator?.positionName }}</td>
      </tr>
    </ng-template>
  </p-table>
</div>
