<div class="p-grid p-justify-center">
  <div class="p-col-12 p-md-6">
    <form [formGroup]="enterpriseForm" (ngSubmit)="onSubmit()">
      <div class="p-field">
        <label for="name">Name</label>
        <input id="name" pInputText formControlName="name" class="p-inputtext" />
        <small class="p-error" *ngIf="enterpriseForm.get('name')?.invalid && enterpriseForm.get('name')?.touched">
          Name is required
        </small>
      </div>

      <div class="p-field">
        <label for="email">Email</label>
        <input id="email" type="email" pInputText formControlName="email" class="p-inputtext" />
        <small class="p-error" *ngIf="enterpriseForm.get('email')?.invalid && enterpriseForm.get('email')?.touched">
          Enter a valid email
        </small>
      </div>

      <div class="p-field">
        <label for="phone">Phone</label>
        <input id="phone" pInputText formControlName="phone" class="p-inputtext" />
        <small class="p-error" *ngIf="enterpriseForm.get('phone')?.invalid && enterpriseForm.get('phone')?.touched">
          Phone is required
        </small>
      </div>

      <div class="p-field">
        <label for="address">Address</label>
        <input id="address" pInputText formControlName="address" class="p-inputtext" />
        <small class="p-error" *ngIf="enterpriseForm.get('address')?.invalid && enterpriseForm.get('address')?.touched">
          Address is required
        </small>
      </div>

      <button pButton type="submit" label="Create Enterprise" icon="pi pi-check" class="p-button-success" [disabled]="enterpriseForm.invalid"></button>
    </form>
  </div>
</div>
