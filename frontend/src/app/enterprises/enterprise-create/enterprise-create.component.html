<div class="form-page">
  <div class="form-card">
    <div class="form-card-header">
      <h2 class="form-card-title">Crear Empresa</h2>
      <p class="form-card-subtitle">Registra una nueva empresa en el sistema</p>
    </div>
    <form [formGroup]="enterpriseForm" (ngSubmit)="onSubmit()">
      <div class="field">
        <label class="field-label" for="name">Nombre <span class="required">*</span></label>
        <input id="name" pInputText formControlName="name" placeholder="Nombre de la empresa"
          [class.ng-invalid]="enterpriseForm.get('name')?.invalid && enterpriseForm.get('name')?.touched" />
        <small class="field-error" *ngIf="enterpriseForm.get('name')?.invalid && enterpriseForm.get('name')?.touched">El nombre es requerido</small>
      </div>
      <div class="field">
        <label class="field-label" for="email">Email <span class="required">*</span></label>
        <input id="email" type="email" pInputText formControlName="email" placeholder="email@empresa.com"
          [class.ng-invalid]="enterpriseForm.get('email')?.invalid && enterpriseForm.get('email')?.touched" />
        <small class="field-error" *ngIf="enterpriseForm.get('email')?.invalid && enterpriseForm.get('email')?.touched">Email válido requerido</small>
      </div>
      <div class="field">
        <label class="field-label" for="phone">Teléfono</label>
        <input id="phone" pInputText formControlName="phone" placeholder="Opcional" />
      </div>
      <div class="field">
        <label class="field-label" for="address">Dirección</label>
        <input id="address" pInputText formControlName="address" placeholder="Opcional" />
      </div>
      <div class="form-actions">
        <button pButton type="button" label="Cancelar" icon="pi pi-times" severity="secondary" (click)="onCancel()"></button>
        <button pButton type="submit" label="Crear Empresa" icon="pi pi-check" [disabled]="enterpriseForm.invalid"></button>
      </div>
    </form>
  </div>
</div>
