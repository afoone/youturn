<form [formGroup]="enterpriseForm" (ngSubmit)="onSubmit()">
  <div class="p-fluid">
    <label for="name">Name</label>
    <input pInputText id="name" formControlName="name" />
    <small *ngIf="enterpriseForm.get('name')?.invalid && enterpriseForm.get('name')?.touched" class="p-error">
      Name is required
    </small>

    <label for="email">Email</label>
    <input pInputText id="email" formControlName="email" />
    <small *ngIf="enterpriseForm.get('email')?.invalid && enterpriseForm.get('email')?.touched" class="p-error">
      Enter a valid email
    </small>

    <label for="phone">Phone</label>
    <input pInputText id="phone" formControlName="phone" />
    <small *ngIf="enterpriseForm.get('phone')?.invalid && enterpriseForm.get('phone')?.touched" class="p-error">
      Phone is required
    </small>

    <label for="address">Address</label>
    <input pInputText id="address" formControlName="address" />
    <small *ngIf="enterpriseForm.get('address')?.invalid && enterpriseForm.get('address')?.touched" class="p-error">
      Address is required
    </small>

    <button pButton type="submit" label="Save" class="p-mt-3" [disabled]="enterpriseForm.invalid"></button>
  </div>
</form>
