<div class="list-container">
  <div class="list-header">
    <div class="list-title-section">
      <h1 class="list-title">Lista de Empresas</h1>
      <p class="list-subtitle">Gestiona las empresas del sistema</p>
    </div>
    <button *ngIf="isAdmin" pButton label="Crear Empresa" icon="pi pi-plus" (click)="addEnterprise()"
      class="create-button"></button>
  </div>

  <div class="list-content">
    <ag-grid-angular style="width: 100%; height: 500px;" [class]="myTheme" [rowData]="enterprises"
      [columnDefs]="columnDefs" [defaultColDef]="defaultColDef" [pagination]="true" [paginationPageSize]="10"
      [paginationPageSizeSelector]="[10, 25, 50]">
    </ag-grid-angular>
  </div>
</div>
