<div class="page-container">
  <div class="page-header">
    <div class="page-header-info">
      <h1 class="page-title">Empresas</h1>
      <p class="page-subtitle">Gestiona las empresas del sistema</p>
    </div>
    <button *ngIf="isAdmin" pButton label="Crear Empresa" icon="pi pi-plus"
      (click)="addEnterprise()" class="btn-primary"></button>
  </div>

  <div class="content-card">
    <p-table [value]="enterprises" [loading]="loading" styleClass="p-datatable-sm app-table"
      [paginator]="true" [rows]="10" [showCurrentPageReport]="true"
      currentPageReportTemplate="Mostrando {first} a {last} de {totalRecords} empresas"
      [rowsPerPageOptions]="[10, 25, 50]">
      <ng-template pTemplate="header">
        <tr>
          <th>Nombre</th>
          <th>Email</th>
          <th>Teléfono</th>
          <th>Dirección</th>
          <th>Acciones</th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-enterprise>
        <tr>
          <td class="cell-primary">{{ enterprise.name }}</td>
          <td class="cell-secondary">{{ enterprise.email }}</td>
          <td class="cell-secondary">{{ enterprise.phone || '-' }}</td>
          <td class="cell-secondary">{{ enterprise.address || '-' }}</td>
          <td>
            <div class="action-buttons" *ngIf="isAdmin">
              <button pButton icon="pi pi-pencil" (click)="editEnterprise(enterprise._id)"
                pTooltip="Editar" tooltipPosition="top" class="btn-icon"></button>
              <button pButton icon="pi pi-trash" (click)="deleteEnterprise(enterprise._id)"
                pTooltip="Eliminar" tooltipPosition="top" class="btn-icon danger"></button>
            </div>
            <span *ngIf="!isAdmin" class="cell-muted">-</span>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
