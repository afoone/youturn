<div class="p-d-flex p-jc-between p-ai-center">
  <h2>Enterprises</h2>
  <button pButton label="Add New Enterprise" icon="pi pi-plus" (click)="addCustomer()"></button>
</div>

<p-table [value]="enterprises" [loading]="loading" [responsive]="true">
  <ng-template pTemplate="header">
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Phone</th>
      <th>Actions</th>
    </tr>
  </ng-template>
  <ng-template pTemplate="body" let-customer>
    <tr>
      <td>{{ customer.name }}</td>
      <td>{{ customer.email }}</td>
      <td>{{ customer.phone }}</td>
      <td>
        <button pButton icon="pi pi-pencil" (click)="editCustomer(customer._id)" label="Edit"></button>
      </td>
    </tr>
  </ng-template>
</p-table>
